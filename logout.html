<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - ShopEasy</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">ShopEasy</h1>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="login.html" class="nav-link">Login</a>
                <a href="signup.html" class="nav-link">Sign Up</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="form-container">
            <h2>Logout Confirmation</h2>
            <div class="logout-message">
                <p>Are you sure you want to logout?</p>
                <div class="logout-actions">
                    <button id="confirmLogout" class="btn btn-primary">Yes, Logout</button>
                    <button id="cancelLogout" class="btn btn-secondary">Cancel</button>
                </div>
            </div>
            <div id="logoutStatus" class="status-message" style="display: none;"></div>
        </div>
    </main>


    <script>
        document.getElementById('confirmLogout').addEventListener('click', function () {
            const statusDiv = document.getElementById('logoutStatus');
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = '<p>Logging out...</p>';

            // Clear localStorage
            localStorage.removeItem('token');
            localStorage.removeItem('user');

            fetch('/api/logout', {
                method: 'POST',
                credentials: 'include'
            })
                .then(response => response.json())
                .then(data => {
                    statusDiv.innerHTML = '<p style="color: green;">Logged out successfully! Redirecting...</p>';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                })
                .catch(error => {
                    console.error('Logout error:', error);
                    // Still redirect since localStorage is already cleared
                    statusDiv.innerHTML = '<p style="color: green;">Logged out. Redirecting...</p>';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                });
        });

        document.getElementById('cancelLogout').addEventListener('click', function () {
            // Use localStorage to determine where to redirect
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (user) {
                if (user.user_type === 'vendor') {
                    window.location.href = 'vendor-dashboard.html';
                } else if (user.user_type === 'customer') {
                    window.location.href = 'customer-dashboard.html';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                window.location.href = 'index.html';
            }
        });


        window.addEventListener('load', function () {
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            if (!user) {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>

</html>
