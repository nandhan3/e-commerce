<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - ShopEasy</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">ShopEasy</h1>
            <div class="nav-menu">
                <a href="customer-dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link">Products</a>
                <a href="cart.html" class="nav-link">Cart</a>
                <a href="logout.html" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="dashboard">
                <div class="dashboard-header">
                    <h2>Customer Dashboard</h2>
                    <p>Welcome back! Browse products and manage your orders.</p>
                </div>

                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <h3>Quick Actions</h3>
                        <div style="display: flex; flex-direction: column; gap: 1rem;">
                            <a href="products.html" class="btn btn-primary">Browse Products</a>
                            <a href="cart.html" class="btn btn-secondary">View Cart</a>
                        </div>
                    </div>

                    <div class="dashboard-card">
                        <h3>Cart Summary</h3>
                        <div id="cartSummary">
                            <p>Loading cart...</p>
                        </div>
                    </div>
                </div>

                <div class="dashboard-card" style="margin-top: 2rem;">
                    <h3>Featured Products</h3>
                    <div id="featuredProducts">
                        <p>Loading products...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <script>

        // Check if user is logged in via localStorage
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!user || user.user_type !== 'customer') {
            window.location.href = 'login.html';
        }


        function loadCartSummary() {
            const token = localStorage.getItem('token');
            fetch('/api/cart', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const container = document.getElementById('cartSummary');
                        if (data.cart_items.length === 0) {
                            container.innerHTML = '<p>Your cart is empty.</p>';
                        } else {
                            const totalItems = data.cart_items.reduce((sum, item) => sum + item.quantity, 0);
                            const totalAmount = data.cart_items.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                            container.innerHTML = `
                                <p><strong>Items in cart:</strong> ${totalItems}</p>
                                <p><strong>Total amount:</strong> ₹${totalAmount.toFixed(2)}</p>
                                <a href="cart.html" class="btn btn-primary" style="margin-top: 1rem;">View Cart</a>
                            `;
                        }
                    }
                })
                .catch(error => {
                    console.error('Error loading cart:', error);
                });
        }


        function loadFeaturedProducts() {
            fetch('/api/products?limit=4')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const container = document.getElementById('featuredProducts');
                        if (data.products.length === 0) {
                            container.innerHTML = '<p>No products available.</p>';
                        } else {
                            container.innerHTML = data.products.map(product => `
                                <div class="product-card" style="margin-bottom: 1rem;">
                                    <div class="product-image">
                                        ${product.image_url ? `<img src="${product.image_url}" alt="${product.name}">` : 'No Image'}
                                    </div>
                                    <div class="product-info">
                                        <h4 class="product-name">${product.name}</h4>
                                        <p class="product-price">₹${product.price}</p>
                                        <p class="product-description">${product.description}</p>
                                        <button onclick="addToCart(${product.id})" class="btn btn-primary">Add to Cart</button>
                                    </div>
                                </div>
                            `).join('');
                        }
                    }
                })
                .catch(error => {
                    console.error('Error loading products:', error);
                });
        }


        function addToCart(productId) {
            const formData = new FormData();
            formData.append('product_id', productId);
            formData.append('quantity', 1);

            const token = localStorage.getItem('token');
            fetch('/api/cart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    product_id: productId,
                    quantity: 1
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Product added to cart!');
                    loadCartSummary();
                } else {
                    alert(data.message || 'Failed to add product to cart');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while adding the product to cart');
            });
        }


        loadCartSummary();
        loadFeaturedProducts();
    </script>
</body>
</html>
