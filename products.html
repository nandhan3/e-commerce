<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - ShopEasy</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">ShopEasy</h1>
            <div class="nav-menu">
                <a href="customer-dashboard.html" class="nav-link">Dashboard</a>
                <a href="products.html" class="nav-link">Products</a>
                <a href="cart.html" class="nav-link">Cart</a>
                <a href="logout.html" class="nav-link">Logout</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="dashboard">
                <div class="dashboard-header">
                    <h2>All Products</h2>
                    <p>Browse our amazing collection of products.</p>
                </div>


                <div class="products-grid" id="productsGrid">
                    <p>Loading products...</p>
                </div>
            </div>
        </div>
    </main>


    <script>
        let allProducts = [];

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // Check if user is logged in via localStorage
        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!user || user.user_type !== 'customer') {
            window.location.href = 'login.html';
        }


        function loadProducts() {
            fetch('/api/products')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        allProducts = data.products;
                        displayProducts(allProducts);
                    } else {
                        document.getElementById('productsGrid').innerHTML = '<p>Error loading products. Please try again.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error loading products:', error);
                    document.getElementById('productsGrid').innerHTML = '<p>Error loading products. Please try again.</p>';
                });
        }


        function displayProducts(products) {
            const container = document.getElementById('productsGrid');
            if (products.length === 0) {
                container.innerHTML = '<p>No products found.</p>';
            } else {
                container.innerHTML = products.map(product => `
                    <div class="product-card">
                        <div class="product-image">
                            ${product.image_url ? `<img src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name)}">` : 'No Image'}
                        </div>
                        <div class="product-info">
                            <h4 class="product-name">${escapeHtml(product.name)}</h4>
                            <p class="product-price">₹${escapeHtml(product.price)}</p>
                            <p class="product-description">${escapeHtml(product.description)}</p>
                            <p><strong>Category:</strong> ${escapeHtml(product.category)}</p>
                            <p><strong>Stock:</strong> ${escapeHtml(product.stock_quantity)}</p>
                            <button onclick="addToCart(${product.id})" class="btn btn-primary" ${product.stock_quantity === 0 ? 'disabled' : ''}>
                                ${product.stock_quantity === 0 ? 'Out of Stock' : 'Add to Cart'}
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }



        function addToCart(productId) {
            const formData = new FormData();
            formData.append('product_id', productId);
            formData.append('quantity', 1);

            fetch('/api/cart', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem('token')}`
                },
                body: JSON.stringify({
                    product_id: productId,
                    quantity: 1
                })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('Product added to cart!');
                    } else {
                        alert(data.message || 'Failed to add product to cart');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An error occurred while adding the product to cart');
                });
        }


        loadProducts();
    </script>
</body>

</html>
